[package]
name = "smart-review"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Valencia"]
description = "A CLI tool for applying the spaced repetition technique"
license = "MIT"
repository = "https://github.com/daniel-valencia-ts/smart-review"
keywords = ["cli", "tool", "spaced-repetition", "sm-2"]
categories = ["command-line-utilities"]

[[bin]]
name = "sr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
colored = "3.1.1"
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.10.3"
rusqlite = {version = "0.41.1", features = ["bundled"]}
